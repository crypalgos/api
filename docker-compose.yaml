version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - GITHUB_PAT=${GITHUB_PAT:-}
    container_name: crypalgos-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    env_file:
      - .env.prod
    networks:
      - crypalgos-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')" || exit 1',
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: crypalgos-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - crypalgos-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - GITHUB_PAT=${GITHUB_PAT:-}
    container_name: crypalgos-celery-worker
    user: "root"
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - WORKSPACE_ROOT=${WORKSPACE_ROOT:-/app}
    env_file:
      - .env.prod
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_ROOT:-/app}:${WORKSPACE_ROOT:-/app}
    healthcheck:
      disable: true
    networks:
      - crypalgos-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  crypalgos-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8:1::/64
